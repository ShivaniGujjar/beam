name: Beam Build Engine

on:
  repository_dispatch:
    types: [trigger-build]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repo_url }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm install

      - name: Run Vite Build
        run: npm run build

      - name: Install Upload Tools
        # Hum sirf ek baar zaroori tools install karenge
        run: npm install @supabase/supabase-js mime-types ws node-fetch

      - name: Upload to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PROJECT_ID: ${{ github.event.client_payload.project_id }}
        run: |
          curl -s https://raw.githubusercontent.com/ShivaniGujjar/beam/master/.github/scripts/upload.cjs -o upload_script.cjs
          node upload_script.cjs

      - name: Notify API Server
        run: |
          curl -X POST http://your-api-url.com/status \
          -H "Content-Type: application/json" \
          -d '{"projectId": "${{ github.event.client_payload.project_id }}", "status": "READY"}'