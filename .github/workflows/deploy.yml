name: Beam Build Engine

on:
  repository_dispatch:
    types: [trigger-build]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Extract Repo Path
        id: repo-check
        run: |
          RAW_URL="${{ github.event.client_payload.repo_url }}"
          CLEAN_REPO=$(echo $RAW_URL | sed 's|https://github.com/||' | sed 's|/$||')
          echo "REPO_PATH=$CLEAN_REPO" >> $GITHUB_OUTPUT

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.repo-check.outputs.REPO_PATH }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm install

      - name: Run Vite Build
        run: npm run build

      - name: Install Upload Tools
        run: npm install @supabase/supabase-js mime-types ws node-fetch

      - name: Upload to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PROJECT_ID: ${{ github.event.client_payload.project_id }}
        run: |
          curl -s https://raw.githubusercontent.com/ShivaniGujjar/beam/master/.github/scripts/upload.cjs -o upload_script.cjs
          node upload_script.cjs

      - name: Notify API Server
        run: |
          # 🚀 TERA REAL LINK MAINE NEECHE DAL DIYA HAI
          curl -X POST https://cmj0bzst-9000.inc1.devtunnels.ms/api/v1/projects/status \
          -H "Content-Type: application/json" \
          -d '{"projectId": "${{ github.event.client_payload.project_id }}", "status": "READY"}'